name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: stylua,selene

      - name: Format check
        run: stylua --check .

      - name: Lint
        run: selene .

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          mkdir -p dist
          zip -r "dist/PACKAGE_NAME-${GITHUB_SHA::7}.zip" . \
            -x ".git/*" ".github/*" "dist/*"

      - uses: actions/upload-artifact@v4
        with:
          name: PACKAGE_NAME
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PACKAGE_NAME
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
