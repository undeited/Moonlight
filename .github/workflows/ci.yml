name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua@2.6.0

      - name: Install selene
        uses: taiki-e/install-action@v2
        with:
          tool: selene@0.31.0

      - name: Format check
        run: stylua --check .

      - name: Lint
        run: selene .

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          mkdir -p dist
          zip -r "dist/moonlight-${GITHUB_SHA::7}.zip" . \
            -x ".git/*" ".github/*" "dist/*" \
               "selene.toml" "stylua.toml" "*.md"

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moonlight
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
